<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="'Detalle - ' + ${producto.nombre}">Detalle del producto</title>
</head>
<body>
<main>
    <!-- Apartado 1: Breadcrumb Inicio / Productos / {nombre} -->
    <section class="mb-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li class="breadcrumb-item"><a th:href="@{/productos}">Productos</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${producto.nombre}">Nombre del producto</li>
            </ol>
        </nav>
    </section>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- Apartado 2: Nombre en h3 y _id debajo en span -->
            <section class="mb-4 border-bottom pb-3">
                <h3 class="mb-1" th:text="${producto.nombre}">Nombre del producto</h3>
                <span class="text-muted small">
                    ID (_id): <strong th:text="${producto.id}">000000000000000000000000</strong>
                </span>
            </section>

            <!-- Apartado 3: Campos precio, categoria y stock -->
            <section>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded border">
                            <div class="text-muted small">Precio</div>
                            <div class="fs-5 fw-semibold">
                                $<span th:text="${producto.precio}">0.00</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded border">
                            <div class="text-muted small">Categoría</div>
                            <div class="fs-5 fw-semibold" th:text="${producto.categoria}">Categoría</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded border">
                            <div class="text-muted small">Stock</div>
                            <div class="fs-5 fw-semibold" th:text="${producto.stock}">0</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div class="card-footer bg-white">
            <a th:href="@{/productos}" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver al catálogo
            </a>
        </div>
    </div>
</main>
</body>
</html>
